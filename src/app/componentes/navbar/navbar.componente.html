<header [class.scrolled]="debeVerseBackground">
  <div class="logo" routerLink="/">
    <div class="logo-icon">🌿</div>
    <span>EcoTech</span>
  </div>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="btn-nav">Inicio</a>
    <a routerLink="/consejos" routerLinkActive="active" class="btn-nav">Consejo</a>
    <a routerLink="/eventos" routerLinkActive="active" class="btn-nav">Eventos</a>
    <a routerLink="/deposito" routerLinkActive="active" class="btn-nav">Depósito</a>
    <a routerLink="/contactanos" routerLinkActive="active" class="btn-nav">Contáctanos</a>

    <ng-container *ngIf="!usuario">
      <a routerLink="/registro" class="btn-registro">Registrarse</a>
    </ng-container>

    <ng-container *ngIf="usuario">
      <app-notificaciones *ngIf="usuario.idusuario"></app-notificaciones>
      <div class="perfil-menu">
        <button class="btn-perfil" (click)="toggleMenuPerfil($event)">
          <div class="perfil-avatar">
            <img
              *ngIf="fotoPerfil; else avatarSvg"
              [src]="fotoPerfil"
              alt="Foto de perfil"
              class="avatar-img">

            <ng-template #avatarSvg>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </ng-template>
          </div>

          <span class="perfil-email">{{ usuario.email.split('@')[0] }}</span>

          <svg class="icono-flecha" [class.rotado]="menuPerfilAbierto" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="dropdown-menu" [class.abierto]="menuPerfilAbierto">
          <div class="dropdown-header">
            <div class="dropdown-avatar-container">
              <div class="dropdown-avatar">
                <img
                  *ngIf="fotoPerfil; else dropdownAvatarSvg"
                  [src]="fotoPerfil"
                  alt="Foto de perfil"
                  class="dropdown-avatar-img">

                <ng-template #dropdownAvatarSvg>
                  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </ng-template>
              </div>
            </div>

            <div class="dropdown-user-info">
              <p class="usuario-nombre">{{ nombreCompleto }}</p>
              <p class="usuario-email">{{ usuario.email }}</p>
            </div>
          </div>

          <div class="dropdown-divider"></div>

          <button class="dropdown-item" (click)="navegarA('/perfil')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Mi Perfil
          </button>

          <button class="dropdown-item" (click)="navegarA('/historial-ecopuntos')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Historial de Eco-Puntos
          </button>

          <button *ngIf="esAdmin()" class="dropdown-item admin-item" (click)="navegarA('/admin/dashboard')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Panel Admin
          </button>

          <button class="dropdown-item" (click)="navegarA('/canje-ecopuntos')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            Canje de Eco-Puntos
          </button>

          <button class="dropdown-item" (click)="navegarA('/suscripcion')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Suscripción
          </button>

          <div class="dropdown-divider"></div>

          <button class="dropdown-item logout" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar Sesión
          </button>
        </div>
      </div>
    </ng-container>
  </nav>
</header>
